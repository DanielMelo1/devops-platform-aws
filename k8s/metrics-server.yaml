apiVersion: v1
kind: Namespace
metadata:
  name: metrics-server
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  repo: https://kubernetes-sigs.github.io/metrics-server/
  chart: metrics-server
  version: "3.12.0"
  targetNamespace: metrics-server
  valuesContent: |-
    args:
      - --kubelet-insecure-tls
