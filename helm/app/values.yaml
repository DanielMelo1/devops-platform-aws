replicaCount: 2

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

hpa:
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70

serviceAccount:
  name: app-service-account

env:
  dbName: "appdb"
  dbUsername: "dbadmin"
  dbPort: "5432"
